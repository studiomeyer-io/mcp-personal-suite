name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# OIDC token required for npm provenance (Trusted Publishing)
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/mcp-personal-suite

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: install
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      - name: build
        run: npm run build

      - name: audit (high+), mit Wiederholung bei Registry-Ausfall
        # Der Audit-Endpunkt von npm ist unzuverlaessig: gemessen am 04.09.2026
        # ein 503 und mehrfach ein 400 "Invalid package tree" bei identischem
        # Lockfile, teils erst nach Minuten. Ein Fund soll den Lauf weiter rot
        # faerben, ein Ausfall bei npm nicht. Deshalb bis zu drei Versuche, und
        # nur wenn ALLE an einem Netz- oder Serverfehler scheitern, wird der
        # Schritt uebersprungen statt zu scheitern.
        run: |
          for versuch in 1 2 3; do
            ausgabe=$(npm audit --audit-level=high 2>&1) && exit 0
            echo "$ausgabe"
            if ! echo "$ausgabe" | grep -qE "audit endpoint returned an error|ECONNRESET|ETIMEDOUT|socket hang up"; then
              echo "Echter Befund, kein Ausfall."
              exit 1
            fi
            echo "Versuch $versuch: npm-Endpunkt nicht erreichbar, neuer Versuch in 30s."
            sleep 30
          done
          echo "::warning::npm audit uebersprungen, der Endpunkt war dreimal nicht erreichbar."

      - name: publish with provenance
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
